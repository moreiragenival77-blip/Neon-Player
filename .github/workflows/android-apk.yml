name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Generate Android project
        run: npx cap add android

      - name: Apply Neon Player launcher and notification icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          res = Path("android/app/src/main/res")
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          foreground = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#39FF14" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M24,48 C24,25 37,14 54,14 C71,14 84,25 84,48"/>
            <path android:fillColor="#102010" android:strokeColor="#39FF14" android:strokeWidth="3" android:pathData="M19,45 Q19,40 24,40 L29,40 Q34,40 34,45 L34,67 Q34,73 28,73 L25,73 Q19,73 19,67 Z M74,45 Q74,40 79,40 L84,40 Q89,40 89,45 L89,67 Q89,73 83,73 L80,73 Q74,73 74,67 Z"/>
            <path android:fillColor="#39FF14" android:pathData="M39,35h5v12h-5z M48,28h5v19h-5z M57,23h5v24h-5z M66,33h5v14h-5z"/>
            <path android:fillColor="#071007" android:strokeColor="#39FF14" android:strokeWidth="3" android:pathData="M54,43 A20,20 0,1 0,54 83 A20,20 0,1 0,54 43"/>
            <path android:fillColor="#7CFF45" android:pathData="M49,52 L49,74 L67,63 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#7CFF45" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M14,91 L31,91 L37,86 L42,96 L48,82 L54,100 L60,82 L66,96 L72,86 L78,91 L94,91"/>
          </vector>"""
          launcher = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#071007" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#00000000" android:strokeColor="#39FF14" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M24,48 C24,25 37,14 54,14 C71,14 84,25 84,48"/>
            <path android:fillColor="#102010" android:strokeColor="#39FF14" android:strokeWidth="3" android:pathData="M19,45 Q19,40 24,40 L29,40 Q34,40 34,45 L34,67 Q34,73 28,73 L25,73 Q19,73 19,67 Z M74,45 Q74,40 79,40 L84,40 Q89,40 89,45 L89,67 Q89,73 83,73 L80,73 Q74,73 74,67 Z"/>
            <path android:fillColor="#39FF14" android:pathData="M39,35h5v12h-5z M48,28h5v19h-5z M57,23h5v24h-5z M66,33h5v14h-5z"/>
            <path android:fillColor="#071007" android:strokeColor="#39FF14" android:strokeWidth="3" android:pathData="M54,43 A20,20 0,1 0,54 83 A20,20 0,1 0,54 43"/>
            <path android:fillColor="#7CFF45" android:pathData="M49,52 L49,74 L67,63 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#7CFF45" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M14,91 L31,91 L37,86 L42,96 L48,82 L54,100 L60,82 L66,96 L72,86 L78,91 L94,91"/>
          </vector>"""
          notification = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M4,13v-2a8,8 0,0 1,16 0v2h-2v-2a6,6 0,0 0,-12 0v2z M3,12h4v7h-2a2,2 0,0 1,-2 -2z M17,12h4v5a2,2 0,0 1,-2 2h-2z"/>
          </vector>"""
          (res / "drawable/ic_neon_launcher_foreground.xml").write_text(foreground)
          (res / "drawable/ic_neon_notification.xml").write_text(notification)
          (res / "values/neon_icon_background.xml").write_text('<resources><color name="neon_icon_background">#071007</color></resources>')
          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/neon_icon_background"/><foreground android:drawable="@drawable/ic_neon_launcher_foreground"/></adaptive-icon>"""
          (res / "mipmap-anydpi-v26/ic_launcher.xml").write_text(adaptive)
          (res / "mipmap-anydpi-v26/ic_launcher_round.xml").write_text(adaptive)
          (res / "mipmap-anydpi/ic_launcher.xml").write_text(launcher)
          (res / "mipmap-anydpi/ic_launcher_round.xml").write_text(launcher)
          PY

      - name: Configure Kotlin version for native plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/build.gradle")
          content = path.read_text()
          if "kotlin_version" not in content:
              path.write_text("ext.kotlin_version = '2.2.20'\n" + content)
          PY

      - name: Sync native plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
